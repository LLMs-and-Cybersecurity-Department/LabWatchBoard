appId: io.basyacatx.labwatch
productName: LabWatch
executableName: LabWatch
artifactName: LabWatch-${version}-Windows-${arch}.${ext}
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - desktop-dist/main.mjs
  - data/seismic/**
  - package.json
  - "!.env"
  - "!.env.*"
  - "!**/.env*"
  - "!**/*.{pem,key,p12,pfx}"
  - "!**/*.map"
  - "!**/*.ts"
  - "!**/*.tsx"
  - "!**/*test*"
  - "!node_modules/**"
asar: true
compression: maximum
npmRebuild: false
electronLanguages:
  - zh-CN
  - en-US
electronFuses:
  runAsNode: false
  enableCookieEncryption: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  loadBrowserProcessSpecificV8Snapshot: false
  grantFileProtocolExtraPrivileges: false
mac:
  category: public.app-category.weather
  target:
    - dmg
    - pkg
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlementsInherit: build/entitlements.mac.plist
pkg:
  allowAnywhere: false
  allowCurrentUserHome: true
win:
  icon: icon/LabWatch.ico
  target:
    - msi
msi:
  oneClick: false
  perMachine: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
linux:
  category: Science
  syncDesktopName: true
  synopsis: 多模式天气与全球地震信息看板
  description: 面向公众的多模式天气、全球地震报告、测站观测与历史回放应用。
  maintainer: BasyaCatX
  vendor: BasyaCatX
  target:
    - AppImage
    - deb
    - rpm
